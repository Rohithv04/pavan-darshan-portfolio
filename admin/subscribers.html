<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribers | CMS — Pavan Darshan Doddala</title>
  
  <!-- Security: Prevent indexing -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <!-- Admin Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <a href="/admin/posts" class="admin-brand">
        <div class="admin-monogram">P</div>
        <div class="admin-title-wrap">
          <span class="admin-portal-title">Content Management</span>
          <span class="admin-portal-subtitle">CMS Portal</span>
        </div>
      </a>
    </div>

    <nav class="admin-nav">
      <a href="/admin/posts" class="admin-nav-item">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>Posts</span>
      </a>
      <a href="/admin/subscribers" class="admin-nav-item active">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Subscribers</span>
      </a>
      <a href="/admin/resume" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        <span>Resume</span>
      </a>
      <a href="/" target="_blank" class="admin-nav-item">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span>View Website</span>
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <div class="admin-user-info" id="adminUserEmail">Administrator</div>
      <button class="admin-logout-btn" id="adminLogoutBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-heading-group">
        <h1>Newsletter Audience</h1>
        <p>Review active email subscribers, export audience CSV, and manage list health.</p>
      </div>
      <div class="admin-header-actions">
        <button id="exportCsvBtn" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Export CSV</span>
        </button>
      </div>
    </header>

    <!-- Subscribers Metric Card -->
    <div class="admin-stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
      <div class="stat-card gold">
        <span class="stat-card-label">Active Email Subscribers</span>
        <span class="stat-card-value" id="subscriberTotalCount">—</span>
      </div>
    </div>

    <!-- Subscribers Table -->
    <div class="admin-card">
      <div class="admin-card-header">
        <div class="admin-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="subscriberSearch" placeholder="Search by email..." aria-label="Search subscribers">
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Email Address</th>
              <th>Date Subscribed</th>
              <th>Status</th>
              <th>Source</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="subscribersTableBody">
            <tr>
              <td colspan="5" style="text-align:center; padding: 32px;">Loading subscribers...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Toast Notification element -->
  <div id="adminToast" class="admin-toast"></div>

  <!-- Scripts -->
  <script src="/js/env.js" onerror="/* env.js is optional; client will fallback to /api/config */"></script>
  <script type="module">
    import { initAdminSubscribers } from '/js/admin.js';
    initAdminSubscribers();
  </script>
</body>
</html>
